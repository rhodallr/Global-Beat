<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobalBeat — The Interactive Cultural Calendar</title>
    <meta
      name="description"
      content="Explore world festivals, regional holidays and global traditions month by month. Filter by region, search any country and download a calendar image."
    />
    <meta name="theme-color" content="#1B1A17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Social sharing preview (Open Graph / X). After your first Vercel deploy,
         replace the og:image and og:url values with your full site address,
         e.g. https://globalbeat.vercel.app/og-image.png -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GlobalBeat — The Interactive Cultural Calendar" />
    <meta property="og:description" content="World festivals, regional holidays and global traditions, one month at a time." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts load here so they're ready before the page paints.
         The id matches the component's own loader, so they aren't loaded twice. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="cc-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <noscript>GlobalBeat needs JavaScript enabled to show the calendar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
